<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Self Onboarding — GymSarthi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Razorpay SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <meta name="theme-color" content="#090D16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/logo.png">
</head>
<body class="bg-[#090D16] text-gray-100 min-h-screen py-10 px-4 flex flex-col justify-between">

  <div class="max-w-2xl mx-auto w-full">
    <!-- Header -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center space-x-3">
        <img src="assets/logo.png" alt="GymSarthi Logo" class="w-12 h-12 rounded-2xl object-cover shadow-lg shadow-emerald-500/20 border border-emerald-500/30">
        <div class="text-left">
          <span class="text-2xl font-black tracking-tight text-white">Gym<span class="gradient-text-emerald">Sarthi</span></span>
          <p class="text-xs text-gray-400">Self Onboarding Portal</p>
        </div>
      </a>
    </div>

    <!-- Main Registration Card -->
    <div class="glass-card p-6 sm:p-10 rounded-3xl border-gray-800 shadow-2xl relative">
      <div class="mb-6">
        <span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Feature 1: Self Onboarding</span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-2">Join Gym & Select Package</h1>
        <p class="text-sm text-gray-400">Fill details, select plan, and choose Cash or Online Payment.</p>
      </div>

      <form id="onboarding-form" class="space-y-6">
        <!-- Section 1: Member Personal Info -->
        <div class="space-y-4">
          <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider border-b border-gray-800 pb-2">1. Personal Information</h2>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-400 mb-1">Full Name *</label>
              <input type="text" id="name" required placeholder="e.g. Vikram Sharma"
                class="w-full px-4 py-3 rounded-xl bg-gray-900/90 border border-gray-700 text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 text-sm">
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-400 mb-1">Mobile Number *</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500 font-bold text-sm">+91</span>
                <input type="tel" id="mobile" required maxlength="10" placeholder="9876543210"
                  class="w-full pl-12 pr-4 py-3 rounded-xl bg-gray-900/90 border border-gray-700 text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 text-sm">
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-400 mb-1">Password *</label>
              <input type="password" id="password" required placeholder="Create Password"
                class="w-full px-4 py-3 rounded-xl bg-gray-900/90 border border-gray-700 text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 text-sm">
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-400 mb-1">Email Address</label>
              <input type="email" id="email" placeholder="vikram@example.com"
                class="w-full px-4 py-3 rounded-xl bg-gray-900/90 border border-gray-700 text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 text-sm">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-gray-400 mb-1">Gender</label>
              <select id="gender" class="w-full px-4 py-3 rounded-xl bg-gray-900/90 border border-gray-700 text-white focus:outline-none focus:border-emerald-500 text-sm">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-400 mb-1">Emergency Contact Number</label>
              <input type="tel" id="emergencyContact" maxlength="10" placeholder="Emergency Phone"
                class="w-full px-4 py-3 rounded-xl bg-gray-900/90 border border-gray-700 text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 text-sm">
            </div>
          </div>
        </div>

        <!-- Section 2: Membership Package Selector -->
        <div class="space-y-4">
          <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider border-b border-gray-800 pb-2">2. Select Membership Package</h2>

          <div id="packages-loading" class="text-center py-4 text-sm text-gray-400">Loading Gym Packages...</div>
          <div id="packages-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 hidden">
            <!-- Dynamic packages injected here -->
          </div>
        </div>

        <!-- Section 3: Payment Method Selector -->
        <div class="space-y-4">
          <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider border-b border-gray-800 pb-2">3. Select Payment Mode</h2>

          <div class="grid grid-cols-2 gap-3">
            <label class="cursor-pointer p-4 rounded-2xl bg-gray-900/90 border-2 border-emerald-500 flex items-center justify-between transition-all" id="pay-online-box">
              <div class="flex items-center space-x-3">
                <input type="radio" name="paymentMethod" value="ONLINE" checked class="text-emerald-500 accent-emerald-500">
                <div>
                  <p class="font-bold text-sm text-white">💳 Online Pay</p>
                  <p class="text-xs text-gray-400">UPI, Cards, NetBanking</p>
                </div>
              </div>
              <span class="text-xs bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded">Instant</span>
            </label>

            <label class="cursor-pointer p-4 rounded-2xl bg-gray-900/90 border-2 border-gray-700 flex items-center justify-between transition-all" id="pay-cash-box">
              <div class="flex items-center space-x-3">
                <input type="radio" name="paymentMethod" value="CASH" class="text-emerald-500 accent-emerald-500">
                <div>
                  <p class="font-bold text-sm text-white">💵 Pay Cash</p>
                  <p class="text-xs text-gray-400">Pay at Gym Counter</p>
                </div>
              </div>
              <span class="text-xs bg-amber-500/20 text-amber-400 font-bold px-2 py-0.5 rounded">Counter</span>
            </label>
          </div>
        </div>

        <!-- Submit Onboarding -->
        <div class="pt-4">
          <button type="submit" id="submit-onboard-btn"
            class="w-full py-4 rounded-2xl font-black text-base bg-gradient-to-r from-emerald-500 to-cyan-500 text-gray-950 shadow-xl shadow-emerald-500/25 hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center space-x-2">
            <span id="btn-text">Complete Onboarding & Pay ₹1,499</span>
            <span>➔</span>
          </button>
        </div>
      </form>

      <div class="mt-6 text-center text-xs text-gray-400">
        Already have a membership? <a href="login.html" class="text-emerald-400 font-bold hover:underline">Log In</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/razorpay.js"></script>
  <script>
    Auth.redirectIfLoggedIn();

    let selectedPackage = null;
    let packagesList = [];

    // Payment Box Radio Styling toggle
    const onlineBox = document.getElementById('pay-online-box');
    const cashBox = document.getElementById('pay-cash-box');

    document.querySelectorAll('input[name="paymentMethod"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === 'ONLINE') {
          onlineBox.className = 'cursor-pointer p-4 rounded-2xl bg-gray-900/90 border-2 border-emerald-500 flex items-center justify-between transition-all';
          cashBox.className = 'cursor-pointer p-4 rounded-2xl bg-gray-900/90 border-2 border-gray-700 flex items-center justify-between transition-all';
        } else {
          cashBox.className = 'cursor-pointer p-4 rounded-2xl bg-gray-900/90 border-2 border-emerald-500 flex items-center justify-between transition-all';
          onlineBox.className = 'cursor-pointer p-4 rounded-2xl bg-gray-900/90 border-2 border-gray-700 flex items-center justify-between transition-all';
        }
      });
    });

    // Load Packages
    async function loadPackages() {
      const grid = document.getElementById('packages-grid');
      const loader = document.getElementById('packages-loading');

      try {
        const pkgs = await Api.getPackages();
        packagesList = Array.isArray(pkgs) ? pkgs : [];

        loader.classList.add('hidden');
        grid.classList.remove('hidden');

        grid.innerHTML = packagesList.map((pkg, idx) => `
          <div onclick="selectPkg('${pkg.package_id}')" id="pkg-card-${pkg.package_id}"
            class="pkg-card cursor-pointer p-4 rounded-2xl border-2 transition-all ${idx === 0 ? 'border-emerald-500 bg-emerald-950/20' : 'border-gray-800 bg-gray-900/60 hover:border-gray-700'}">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-gray-800 text-emerald-400">${pkg.badge || 'Plan'}</span>
              <span class="text-xs text-gray-400">${pkg.duration_days || 30} Days</span>
            </div>
            <p class="font-bold text-sm text-white">${pkg.name}</p>
            <p class="text-lg font-black text-emerald-400 mt-1">₹${Number(pkg.price).toLocaleString('en-IN')}</p>
          </div>
        `).join('');

        // Select first by default
        selectPkg(packagesList[0].package_id);

      } catch (err) {
        console.warn('Failed to fetch backend packages, using defaults:', err);
        packagesList = [
          { package_id: 'PKG_1M', name: 'Monthly Fitness Pass', duration_days: 30, price: 1499, badge: 'Popular' },
          { package_id: 'PKG_3M', name: 'Quarterly Transformer', duration_days: 90, price: 3999, badge: 'Best Value' },
          { package_id: 'PKG_6M', name: 'Half-Yearly Beast Mode', duration_days: 180, price: 6999, badge: 'Pro Choice' },
          { package_id: 'PKG_12M', name: 'Annual Champion Pass', duration_days: 365, price: 11999, badge: 'Max Savings' }
        ];

        loader.classList.add('hidden');
        grid.classList.remove('hidden');
        grid.innerHTML = packagesList.map((pkg, idx) => `
          <div onclick="selectPkg('${pkg.package_id}')" id="pkg-card-${pkg.package_id}"
            class="pkg-card cursor-pointer p-4 rounded-2xl border-2 transition-all ${idx === 0 ? 'border-emerald-500 bg-emerald-950/20' : 'border-gray-800 bg-gray-900/60 hover:border-gray-700'}">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-gray-800 text-emerald-400">${pkg.badge}</span>
              <span class="text-xs text-gray-400">${pkg.duration_days} Days</span>
            </div>
            <p class="font-bold text-sm text-white">${pkg.name}</p>
            <p class="text-lg font-black text-emerald-400 mt-1">₹${Number(pkg.price).toLocaleString('en-IN')}</p>
          </div>
        `).join('');
        selectPkg(packagesList[0].package_id);
      }
    }

    function selectPkg(pkgId) {
      selectedPackage = packagesList.find(p => p.package_id === pkgId) || packagesList[0];
      document.querySelectorAll('.pkg-card').forEach(card => {
        card.className = 'pkg-card cursor-pointer p-4 rounded-2xl border-2 border-gray-800 bg-gray-900/60 hover:border-gray-700 transition-all';
      });

      const selectedCard = document.getElementById(`pkg-card-${pkgId}`);
      if (selectedCard) {
        selectedCard.className = 'pkg-card cursor-pointer p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-950/20 transition-all';
      }

      document.getElementById('btn-text').textContent = `Complete Onboarding & Pay ₹${Number(selectedPackage.price).toLocaleString('en-IN')}`;
    }

    loadPackages();

    // Submit Onboarding Flow
    document.getElementById('onboarding-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const mobile = document.getElementById('mobile').value.trim();
      const password = document.getElementById('password').value.trim();
      const email = document.getElementById('email').value.trim();
      const gender = document.getElementById('gender').value;
      const emergencyContact = document.getElementById('emergencyContact').value.trim();
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

      if (mobile.length !== 10) {
        Utils.showToast('Please enter a valid 10-digit mobile number.', 'error');
        return;
      }

      const submitBtn = document.getElementById('submit-onboard-btn');
      submitBtn.disabled = true;

      const finishRegistration = async (razorpayPaymentId = null) => {
        submitBtn.innerHTML = `<span>Saving Onboarding...</span>`;
        try {
          const res = await Api.registerMember({
            name,
            mobile,
            password,
            email,
            gender,
            emergencyContact,
            packageId: selectedPackage ? selectedPackage.package_id : 'PKG_1M',
            paymentMethod,
            razorpayPaymentId
          });

          Auth.setSession(res.token, res.user);
          Utils.showToast(`🎉 Onboarding Complete! Welcome to the Gym, ${res.user.name}!`, 'success');

          setTimeout(() => {
            window.location.href = 'member-dashboard.html';
          }, 600);

        } catch (err) {
          Utils.showToast(err.message || 'Registration failed.', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Complete Onboarding & Pay ₹${Number(selectedPackage.price).toLocaleString('en-IN')}</span><span>➔</span>`;
        }
      };

      if (paymentMethod === 'ONLINE') {
        // Feature 5: Gym Razorpay Gateway
        RazorpayHandler.openCheckout({
          amount: selectedPackage ? selectedPackage.price : 1499,
          isSubscription: false, // Gym Revenue
          description: `Membership Onboarding — ${selectedPackage ? selectedPackage.name : 'Package'}`,
          customerName: name,
          customerMobile: mobile,
          customerEmail: email,
          onSuccess: (paymentId) => {
            finishRegistration(paymentId);
          },
          onFailure: (errMsg) => {
            Utils.showToast(errMsg || 'Online payment cancelled.', 'warning');
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>Complete Onboarding & Pay ₹${Number(selectedPackage.price).toLocaleString('en-IN')}</span><span>➔</span>`;
          }
        });
      } else {
        // Cash Payment
        finishRegistration('CASH_ONBOARDING');
      }
    });
  </script>
</body>
</html>
