<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Packages — GymSarthi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <meta name="theme-color" content="#090D16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/logo.png">
</head>
<body class="bg-[#090D16] text-gray-100 min-h-screen">

  <div class="flex">
    <div id="sidebar-container"></div>

    <div class="flex-1 lg:pl-64 flex flex-col min-h-screen min-w-0 max-w-full overflow-x-hidden">
      <header class="h-16 sm:h-20 bg-gray-900/80 backdrop-blur-xl border-b border-gray-800 flex items-center justify-between px-2 sm:px-6 sticky top-0 z-30 min-w-0 max-w-full overflow-hidden">
        <div class="flex items-center space-x-1.5 sm:space-x-4 overflow-hidden min-w-0 flex-1">
          <button id="mobile-menu-toggle" class="lg:hidden p-1.5 text-gray-400 hover:text-white rounded-lg focus:outline-none shrink-0">
            ☰
          </button>
          <div class="truncate min-w-0">
            <h1 class="text-xs sm:text-xl font-bold text-white truncate">Gym Membership Packages</h1>
            <p class="text-[10px] sm:text-xs text-gray-400 truncate hidden sm:block">Configure plans for member self-onboarding</p>
          </div>
        </div>

        <button onclick="openAddPackageModal()" class="px-2.5 sm:px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-gray-950 font-bold text-xs shadow hover:scale-[1.02] transition-all shrink-0 ml-1 sm:ml-2">
          + Create Package
        </button>
      </header>

      <main class="p-3 sm:p-6 space-y-4 sm:space-y-6 flex-1 pb-24 lg:pb-6">
        <div id="packages-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
          <!-- Packages list populated dynamically -->
        </div>
      </main>
    </div>
  </div>

  <!-- Create / Edit Package Modal -->
  <div id="pkg-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="glass-card max-w-md w-full p-6 rounded-3xl border-gray-800 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-gray-800 pb-3">
        <h3 class="font-bold text-white text-base">Create Gym Membership Package</h3>
        <button onclick="closeAddPackageModal()" class="text-gray-400 hover:text-white">✕</button>
      </div>

      <form id="add-pkg-form" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Package Name</label>
          <input type="text" id="pkg-name" required placeholder="e.g. Quarterly Transformer" class="w-full px-3.5 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white text-xs">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Duration (Days)</label>
            <input type="number" id="pkg-duration" required placeholder="90" value="30" class="w-full px-3.5 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white text-xs">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Price (₹)</label>
            <input type="number" id="pkg-price" required placeholder="3999" class="w-full px-3.5 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white text-xs">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Badge / Tag (Optional)</label>
          <input type="text" id="pkg-badge" placeholder="e.g. Popular, Best Value, 20% OFF" class="w-full px-3.5 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white text-xs">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Description</label>
          <input type="text" id="pkg-desc" placeholder="e.g. 90 Days Access + Personal Trainer Consult" class="w-full px-3.5 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white text-xs">
        </div>

        <button type="submit" class="w-full py-3 rounded-xl font-bold text-xs bg-emerald-500 text-gray-950 mt-2 shadow hover:opacity-90">
          Save Package to Database
        </button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/owner-sidebar.js"></script>
  <script src="js/owner-router.js"></script>
  <script>
    Auth.requireAuth('OWNER');
    OwnerSidebar.render('packages');

    async function loadPackages() {
      const grid = document.getElementById('packages-grid');
      try {
        const renderList = (pkgs) => {
          const list = Array.isArray(pkgs) ? pkgs : [];
          if (grid) {
            grid.innerHTML = list.map(p => `
              <div class="glass-card p-6 rounded-3xl border-gray-800 flex flex-col justify-between glass-card-hover relative group">
                <div>
                  <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">${p.duration_days} Days</span>
                    <span class="text-[10px] text-gray-500 font-mono">${p.badge || p.package_id}</span>
                  </div>
                  <h3 class="font-bold text-lg text-white">${p.name}</h3>
                  <p class="text-xs text-gray-400 mt-2">${p.description || 'Full Gym Access'}</p>
                </div>
                <div class="mt-6 pt-4 border-t border-gray-800 flex items-center justify-between">
                  <span class="text-2xl font-black text-emerald-400">₹${Number(p.price).toLocaleString('en-IN')}</span>
                  <button onclick="deletePkg('${p.package_id}')" class="text-rose-400 hover:text-rose-300 font-bold text-xs p-1">
                    Delete
                  </button>
                </div>
              </div>
            `).join('');
          }
        };

        const pkgs = await Api.getPackages(CONFIG.GYM_ID, false, (freshPkgs) => {
          renderList(freshPkgs);
        });
        if (pkgs) renderList(pkgs);

      } catch (err) {
        console.warn('Packages load error:', err);
      }
    }

    function openAddPackageModal() {
      document.getElementById('pkg-modal').classList.remove('hidden');
    }

    function closeAddPackageModal() {
      document.getElementById('pkg-modal').classList.add('hidden');
    }

    async function deletePkg(pkgId) {
      if (!confirm('Are you sure you want to delete this membership package?')) return;
      try {
        await Api.deletePackage(pkgId);
        Utils.showToast('Package deleted successfully.', 'info');
        loadPackages();
      } catch (err) {
        Utils.showToast('Failed to delete package.', 'error');
      }
    }

    document.getElementById('add-pkg-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await Api.savePackage({
          gymId: CONFIG.GYM_ID,
          name: document.getElementById('pkg-name').value,
          durationDays: Number(document.getElementById('pkg-duration').value),
          price: Number(document.getElementById('pkg-price').value),
          badge: document.getElementById('pkg-badge').value || 'New',
          description: document.getElementById('pkg-desc').value
        });
        Utils.showToast('🎉 Gym Package created successfully!', 'success');
        closeAddPackageModal();
        document.getElementById('add-pkg-form').reset();
        loadPackages();
      } catch (err) {
        Utils.showToast(err.message || 'Failed to save package.', 'error');
      }
    });

    loadPackages();
  </script>
</body>
</html>
