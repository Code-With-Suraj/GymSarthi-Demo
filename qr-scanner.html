<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gate QR Scanner — GymSarthi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <meta name="theme-color" content="#090D16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/logo.png">
</head>
<body class="bg-[#090D16] text-gray-100 min-h-screen flex flex-col justify-between p-4">

  <div class="max-w-md mx-auto w-full">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <a href="member-dashboard.html" class="flex items-center space-x-2 text-sm font-semibold text-gray-400 hover:text-white">
        <span>← Back to Dashboard</span>
      </a>
      <span class="px-3 py-1 rounded-full text-xs font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">Feature 3: Gate QR</span>
    </div>

    <!-- Scanner Container Card -->
    <div class="glass-card p-6 rounded-3xl border-gray-800 shadow-2xl text-center space-y-6">
      <div>
        <h1 class="text-2xl font-black text-white">Scan Gym Gate QR Code</h1>
        <p class="text-xs text-gray-400 mt-1">Scan while entering (Check-In) or leaving (Check-Out)</p>
      </div>

      <!-- Camera Scanner Frame -->
      <div class="relative bg-gray-950 rounded-2xl p-2 border border-gray-800 min-h-[280px] flex flex-col items-center justify-center overflow-hidden">
        <div id="qr-reader" class="w-full"></div>
        <div id="scanner-placeholder" class="text-center p-6 space-y-3">
          <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-3xl mx-auto">
            📷
          </div>
          <p class="text-xs text-gray-400">Click below to start your mobile camera scanner.</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="space-y-3">
        <button id="start-cam-btn" onclick="startScanner()"
          class="w-full py-3.5 rounded-xl font-bold text-sm bg-gradient-to-r from-emerald-500 to-cyan-500 text-gray-950 shadow-lg shadow-emerald-500/20 hover:scale-[1.01] transition-all">
          Start Camera Scanner
        </button>

        <!-- Simulator Button for Desktop/Testing -->
        <button onclick="simulateGateScan()"
          class="w-full py-3 rounded-xl font-semibold text-xs bg-gray-900 border border-gray-700 text-gray-300 hover:bg-gray-800 transition-all flex items-center justify-center space-x-2">
          <span>⚡ Simulate Gate QR Scan (Instant Test)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Scan Result Success Modal -->
  <div id="scan-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="glass-card max-w-sm w-full p-8 rounded-3xl text-center space-y-4 border-emerald-500/50 shadow-2xl emerald-glow">
      <div id="scan-icon" class="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 border-2 border-emerald-500 flex items-center justify-center text-4xl mx-auto">
        ✅
      </div>
      <h2 id="scan-title" class="text-2xl font-black text-white">Entry Done!</h2>
      <p id="scan-message" class="text-sm text-gray-300">Checked IN at 08:15 AM</p>
      <div class="pt-2">
        <button onclick="closeScanModal()" class="w-full py-3 rounded-xl font-bold text-sm bg-emerald-500 text-gray-950">
          OK, Got It
        </button>
      </div>
    </div>
  </div>

  <footer class="border-t border-gray-800 py-4 text-center text-xs text-gray-500">
    GymSarthi • Gate QR Attendance Punching System
  </footer>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    Auth.requireAuth('MEMBER');

    const user = Auth.getUser();
    let html5QrCode = null;

    async function startScanner() {
      const placeholder = document.getElementById('scanner-placeholder');
      const startBtn = document.getElementById('start-cam-btn');

      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("qr-reader");
        }

        placeholder.style.display = 'none';
        startBtn.textContent = 'Scanning active...';
        startBtn.disabled = true;

        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (qrCodeMessage) => {
            // QR Code Detected
            html5QrCode.stop();
            processGateScan(qrCodeMessage);
          },
          (errorMessage) => {
            // Scanning in progress
          }
        );
      } catch (err) {
        Utils.showToast('Camera permission denied or camera not found. Use "Simulate Gate QR Scan" button below for desktop testing.', 'warning');
        placeholder.style.display = 'block';
        startBtn.textContent = 'Start Camera Scanner';
        startBtn.disabled = false;
      }
    }

    async function simulateGateScan() {
      processGateScan(CONFIG.GYM_ID);
    }

    async function processGateScan(scannedQrData) {
      Utils.showToast('Processing Gate QR Attendance Punch...', 'info');

      try {
        const res = await Api.scanQR(user.member_id || user.id, CONFIG.GYM_ID);

        const iconEl = document.getElementById('scan-icon');
        const titleEl = document.getElementById('scan-title');
        const msgEl = document.getElementById('scan-message');
        const modal = document.getElementById('scan-modal');

        if (res.action === 'CHECK_OUT') {
          iconEl.className = 'w-20 h-20 rounded-full bg-cyan-500/20 text-cyan-400 border-2 border-cyan-500 flex items-center justify-center text-4xl mx-auto';
          iconEl.textContent = '👋';
          titleEl.textContent = 'OUT DONE! (Check-Out)';
          msgEl.textContent = `Checked OUT at ${res.time}. Workout session finished!`;
        } else {
          iconEl.className = 'w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 border-2 border-emerald-500 flex items-center justify-center text-4xl mx-auto';
          iconEl.textContent = '🏋️‍♂️';
          titleEl.textContent = 'ENTRY DONE! (Check-In)';
          msgEl.textContent = `Checked IN at ${res.time}. Have a great workout!`;
        }

        modal.classList.remove('hidden');

      } catch (err) {
        Utils.showToast(err.message || 'Gate QR scan failed.', 'error');
      }
    }

    function closeScanModal() {
      document.getElementById('scan-modal').classList.add('hidden');
      window.location.href = 'member-dashboard.html';
    }
  </script>
</body>
</html>
